<!--
  Walkable world, single file. Generated by the Sloyd Worldbuilding Team (scene-assembler skill).

  HOW TO OPEN
    - Placeholder mode (no assets): double-click this file. It works from file://.
    - With real assets: serve the folder, because browsers block file:// fetches of GLB/JPG:
        npx serve .        or        python3 -m http.server 8000
      then open http://localhost:8000/index.html (or whatever this file is called).

  CONTROLS   Click to start | WASD / arrows move | Mouse look | Shift sprint | T tour | P print position | Esc release
  URL FLAGS  ?tour=1 (play the camera tour, used for demo recordings)   ?hud=0 (hide overlay)   ?debug=1 (show colliders)

  Everything about the world lives in the <script id="world"> JSON block below. Edit that, not the code.
  Any prop "url" that is missing or fails to load becomes a grey placeholder box at the right real-world size,
  and a missing sky becomes a procedural gradient, so the scene always opens.
-->

<style>

  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #title { position: absolute; left: 24px; top: 20px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .2px; }
  #title p { margin: 2px 0 0; font-size: 13px; opacity: .75; max-width: 46ch; }
  #badge { position: absolute; right: 20px; bottom: 20px; padding: 8px 16px; border-radius: 38px; font-size: 13px; font-weight: 600;
           color: #021225; background: linear-gradient(63deg, #45bcff 19%, #03f584 100%); }
  #hint { position: absolute; left: 24px; bottom: 20px; font-size: 12px; opacity: .7; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2,18,37,.55); color: #fff; cursor: pointer; }
  #start div { text-align: center; }
  #start b { display: inline-block; margin-top: 14px; padding: 12px 28px; border-radius: 38px; color: #021225; font-weight: 600;
             background: linear-gradient(63deg, #45bcff 19%, #03f584 100%); }
  #status { position: absolute; right: 20px; top: 20px; font-size: 12px; opacity: .6; text-align: right; white-space: pre; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.7); }
  .hidden { display: none !important; }
</style>

</head>
<body>
<div id="hud">
  <div id="title"><h1></h1><p></p></div>
  <div id="status"></div>
  <div id="cross"></div>
  <div id="hint">WASD move · Mouse look · Shift sprint · T tour</div>
  <div id="badge">Made with Sloyd</div>
</div>
<div id="start"><div><div style="font-size:28px;font-weight:600" id="startTitle"></div><b>Click to walk</b></div></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

const W = JSON.parse(document.getElementById("world").textContent);
const Q = new URLSearchParams(location.search);
const TOUR = Q.get("tour") === "1", DEBUG = Q.get("debug") === "1";
const $ = (s) => document.querySelector(s);
if (Q.get("hud") === "0") $("#hud").classList.add("hidden");
$("#title h1").textContent = W.title; $("#title p").textContent = W.subtitle || "";
$("#startTitle").textContent = W.title; document.title = `${W.title} | Sloyd Worldbuilding Team`;
const status = []; const log = (m) => { status.push(m); $("#status").textContent = status.slice(-4).join("\n"); console.log("[world]", m); };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = W.exposure ?? 1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(W.fog?.color ?? "#000", W.fog?.density ?? 0);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 2000);
const P = W.player;
camera.position.set(P.spawn[0], P.eyeHeight, P.spawn[1]);
camera.lookAt(P.lookAt[0], P.eyeHeight, P.lookAt[1]);
const pmrem = new THREE.PMREMGenerator(renderer);

// ---------- sky ----------
function placeholderSky() {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 512;
  const g = c.getContext("2d"), s = W.sky;
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, s.placeholderTop); grd.addColorStop(0.5, s.placeholderHorizon); grd.addColorStop(1, s.placeholderBottom);
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 140; i++) { // fake skyline so scale reads even with no assets
    const w = 6 + Math.random() * 22, h = 20 + Math.random() * 120, x = Math.random() * 1024;
    g.fillStyle = `rgba(10,8,25,${0.6 + Math.random() * 0.4})`; g.fillRect(x, 256 - h, w, h + 256);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function applySky(tex) {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = tex;
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  scene.backgroundIntensity = W.sky.backgroundIntensity ?? 1;
  scene.environmentIntensity = W.sky.environmentIntensity ?? 1;
  const r = THREE.MathUtils.degToRad(W.sky.rotationDeg || 0);
  scene.backgroundRotation.set(0, r, 0); scene.environmentRotation.set(0, r, 0);
}
async function loadSky() {
  if (!W.sky.panorama) { applySky(placeholderSky()); log("sky: placeholder"); return; }
  try {
    const tex = await new THREE.TextureLoader().loadAsync(W.sky.panorama);
    tex.colorSpace = THREE.SRGBColorSpace; applySky(tex); log("sky: loaded");
  } catch (e) { applySky(placeholderSky()); log("sky: failed, placeholder"); }
}

// ---------- lights ----------
const L = W.lights || {};
if (L.hemisphere) scene.add(new THREE.HemisphereLight(L.hemisphere.sky, L.hemisphere.ground, L.hemisphere.intensity));
if (L.key) { const d = new THREE.DirectionalLight(L.key.color, L.key.intensity); d.position.fromArray(L.key.position); scene.add(d); }

// ---------- ground ----------
const G = W.ground, [GW, GD] = G.size;
function wetRoughnessMap() { // procedural puddles from smooth value noise: dark = glossy (puddle), light = rough concrete
  const N = 512, c = document.createElement("canvas"); c.width = c.height = N; const g = c.getContext("2d");
  const octave = (cells, alpha) => {
    const s = document.createElement("canvas"); s.width = s.height = cells; const sg = s.getContext("2d"), img = sg.createImageData(cells, cells);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    sg.putImageData(img, 0, 0); g.globalAlpha = alpha; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(s, 0, 0, N, N);
  };
  octave(6, 1); octave(14, 0.45); octave(48, 0.18);
  g.globalAlpha = 1;
  const d = g.getImageData(0, 0, N, N), wet = G.wetness ?? 0.5, cut = 255 * (0.35 + wet * 0.3);
  for (let i = 0; i < d.data.length; i += 4) { // threshold with a soft edge -> puddle shapes
    const v = d.data[i], t = THREE.MathUtils.smoothstep(v, cut - 18, cut + 18);
    const r = 30 + t * 190 + (Math.random() - 0.5) * 30; d.data[i] = d.data[i + 1] = d.data[i + 2] = r;
  }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(GW / 14, GD / 14); return t;
}
const groundMat = new THREE.MeshStandardMaterial({ color: G.color, roughness: 1, metalness: 0.0, roughnessMap: wetRoughnessMap() });
const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD), groundMat);
groundMesh.rotation.x = -Math.PI / 2; scene.add(groundMesh);
if (G.parapetHeight > 0) {
  const pm = new THREE.MeshStandardMaterial({ color: G.color, roughness: 0.8 }), t = 0.3, h = G.parapetHeight;
  for (const [w, d, x, z] of [[GW + t * 2, t, 0, -GD / 2 - t / 2], [GW + t * 2, t, 0, GD / 2 + t / 2], [t, GD, -GW / 2 - t / 2, 0], [t, GD, GW / 2 + t / 2, 0]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), pm); m.position.set(x, h / 2, z); scene.add(m);
    if (G.edgeGlow) { // thin emissive strip on top of the parapet, reads as a neon edge
      const s = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.06), 0.04, Math.max(d, 0.06)),
        new THREE.MeshBasicMaterial({ color: G.edgeGlow })); s.position.set(x, h + 0.02, z); scene.add(s);
    }
  }
  if (G.type === "rooftop") { // building below the roof, so looking over the edge reads as height
    const b = new THREE.Mesh(new THREE.BoxGeometry(GW + 0.6, 120, GD + 0.6), new THREE.MeshStandardMaterial({ color: "#14161c", roughness: 0.9 }));
    b.position.y = -60.01; scene.add(b);
  }
}

// ---------- props ----------
const colliders = []; // {x, z, r}
const gltf = new GLTFLoader();
function normalise(obj, height) { // scale to real-world height, base on y=0, centred on origin
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3());
  const s = height / (size.y || 1); obj.scale.multiplyScalar(s);
  box.setFromObject(obj); const c = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  const wrap = new THREE.Group(); wrap.add(obj);
  const sz = box.getSize(new THREE.Vector3()); wrap.userData.radius = Math.max(sz.x, sz.z) / 2;
  return wrap;
}
function placeholder(p) {
  const w = p.height * 0.6, m = new THREE.Mesh(new THREE.BoxGeometry(w, p.height, w),
    new THREE.MeshStandardMaterial({ color: p.color || "#888", roughness: 0.6, metalness: 0.2 }));
  m.position.y = p.height / 2; const g = new THREE.Group(); g.add(m); g.userData.radius = w / 2; return g;
}
async function loadProp(p) {
  let base;
  if (p.url) {
    try {
      const res = await gltf.loadAsync(p.url); res.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
      base = normalise(res.scene, p.height); log(`${p.id}: loaded`);
    } catch (e) { base = placeholder(p); log(`${p.id}: failed, placeholder`); }
  } else { base = placeholder(p); log(`${p.id}: placeholder`); }
  for (const i of p.instances) {
    const o = base.clone(); const s = i.scale ?? 1;
    o.position.set(i.x, i.y ?? 0, i.z); o.rotation.y = THREE.MathUtils.degToRad(i.rotY || 0); o.scale.setScalar(s);
    scene.add(o);
    if (!p.walkThrough) colliders.push({ x: i.x, z: i.z, r: base.userData.radius * s * (p.colliderScale ?? 0.8) });
    if (p.light) {
      const l = new THREE.PointLight(p.light.color, p.light.intensity, p.light.distance, 2);
      const off = new THREE.Vector3().fromArray(p.light.offset || [0, 1, 0]).applyAxisAngle(new THREE.Vector3(0, 1, 0), o.rotation.y);
      l.position.copy(o.position).add(off); scene.add(l);
    }
  }
}

// ---------- rain ----------
let rain;
if (W.weather?.rain) {
  const n = W.weather.rainCount || 5000, pos = new Float32Array(n * 6);
  for (let i = 0; i < n; i++) {
    const x = (Math.random() - 0.5) * 60, y = Math.random() * 30, z = (Math.random() - 0.5) * 60;
    pos.set([x, y, z, x + 0.03, y - 0.6, z], i * 6);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  rain = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: "#9fb7ff", transparent: true, opacity: 0.35 }));
  scene.add(rain);
}

// ---------- debug colliders ----------
function drawColliders() {
  for (const c of colliders) {
    const m = new THREE.Mesh(new THREE.RingGeometry(c.r - 0.03, c.r, 32), new THREE.MeshBasicMaterial({ color: "#03f584", side: 2 }));
    m.rotation.x = -Math.PI / 2; m.position.set(c.x, 0.02, c.z); scene.add(m);
  }
}

// ---------- controls ----------
const controls = new PointerLockControls(camera, renderer.domElement);
const keys = {};
addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyP") console.log(`[world] position [${camera.position.x.toFixed(2)}, ${camera.position.z.toFixed(2)}]`);
  if (e.code === "KeyT") startTour();
});
addEventListener("keyup", (e) => (keys[e.code] = false));
$("#start").addEventListener("click", () => { $("#start").classList.add("hidden"); if (!TOUR) controls.lock(); });
controls.addEventListener("unlock", () => { if (!touring) $("#start").classList.remove("hidden"); });

function collide(pos) {
  const r = P.radius, hx = GW / 2 - r, hz = GD / 2 - r;
  pos.x = THREE.MathUtils.clamp(pos.x, -hx, hx); pos.z = THREE.MathUtils.clamp(pos.z, -hz, hz);
  for (const c of colliders) {
    const dx = pos.x - c.x, dz = pos.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
    if (d < min && d > 1e-4) { pos.x = c.x + (dx / d) * min; pos.z = c.z + (dz / d) * min; }
  }
}

// ---------- tour (deterministic camera path for recordings) ----------
let touring = false, tourT0 = 0, tourCurve, lookCurve;
function startTour() {
  const pts = W.tour?.points; if (!pts || pts.length < 2) return;
  tourCurve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], P.eyeHeight, p[1])));
  lookCurve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[2], P.eyeHeight * 0.95, p[3])));
  touring = true; tourT0 = performance.now(); $("#start").classList.add("hidden");
}
window.__tour = { start: startTour, seconds: () => W.tour?.seconds || 20 };
window.__tourAt = (u) => { // jump to a tour position (0..1) for frame-exact capture
  if (!tourCurve) startTour(); touring = false;
  const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  camera.position.copy(tourCurve.getPointAt(e)); camera.lookAt(lookCurve.getPointAt(e));
};

// ---------- loop ----------
const clock = new THREE.Clock(), vel = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (touring) {
    const u = Math.min((performance.now() - tourT0) / 1000 / (W.tour.seconds || 20), 1);
    window.__tourAt(u); touring = u < 1;
  } else if (controls.isLocked) {
    const sp = keys.ShiftLeft || keys.ShiftRight ? P.sprintSpeed : P.walkSpeed;
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    vel.set(s, 0, f); if (vel.lengthSq()) vel.normalize().multiplyScalar(sp * dt);
    controls.moveForward(vel.z); controls.moveRight(vel.x);
    collide(camera.position); camera.position.y = P.eyeHeight;
  }
  if (rain) { rain.position.y = (rain.position.y - dt * 18) % 30; rain.position.x = camera.position.x; rain.position.z = camera.position.z; }
  renderer.render(scene, camera);
  if (!CAPTURE) requestAnimationFrame(frame);
}
// ?capture=1: no animation loop. A recorder calls __renderAt(u, dt) once per video frame for frame-exact output.
const CAPTURE = Q.get("capture") === "1";
window.__renderAt = (u, dt = 1 / 30) => {
  window.__tourAt(u);
  if (rain) { rain.position.y = (rain.position.y - dt * 18) % 30; rain.position.x = camera.position.x; rain.position.z = camera.position.z; }
  renderer.render(scene, camera);
};
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

await Promise.all([loadSky(), ...W.props.map(loadProp)]);
if (DEBUG) drawColliders();
window.__worldReady = true; log("ready");
setTimeout(() => $("#status").classList.add("hidden"), 2500);
frame();
if (TOUR) startTour();
</script>
</body>
</html>
